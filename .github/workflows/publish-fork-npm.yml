name: publish-fork-npm

# Fork-only: builds the daemon npm package, rewrites the name to
# "open-design-dev-fork" via jq (no source edits), and publishes to npm
# with provenance using pnpm publish (which natively converts workspace:*
# deps to real versions).
#
# Requires trusted publishing setup on npmjs.com:
#   Package: open-design-dev-fork
#   Settings → Trusted publishing → Add trust relationship
#     Repository: stone-w4tch3r/open-design-fork
#     Workflow path: .github/workflows/publish-fork-npm.yml
#
# After setup, this workflow publishes without a token (OIDC).

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install

      - name: Build publishable package
        run: pnpm --filter @open-design/daemon exec tsx scripts/build-for-publish.ts

      - name: Rewrite package name for fork (jq, no source edits)
        working-directory: apps/daemon
        run: |
          set -e
          cp package.json package.json.orig

          # Only rewrite the name. workspace:* deps are handled natively
          # by pnpm publish — no manual stripping needed.
          jq '.name = "open-design-dev-fork"' package.json > package.json.tmp
          mv package.json.tmp package.json

          echo "::group::Modified package.json"
          cat package.json
          echo "::endgroup::"

      - name: Publish to npm (pnpm handles workspace:* conversion)
        working-directory: apps/daemon
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Restore original package.json
        if: always()
        working-directory: apps/daemon
        run: mv package.json.orig package.json
