name: publish-fork-npm

# Fork-only: builds the daemon npm package, rewrites the name to
# "open-design-dev-fork" via jq (no source edits), strips workspace:*
# deps, packs, and publishes to npm with provenance.
#
# Requires trusted publishing setup on npmjs.com:
#   Package: open-design-dev-fork
#   Settings → Trusted publishing → Add trust relationship
#     Repository: stone-w4tch3r/open-design-fork
#     Workflow path: .github/workflows/publish-fork-npm.yml
#
# After setup, this workflow publishes without a token (OIDC).

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install

      - name: Build publishable package
        run: pnpm --filter @open-design/daemon exec tsx scripts/build-for-publish.ts

      - name: Rewrite package name for fork + repack
        working-directory: apps/daemon
        run: |
          set -e
          cp package.json package.json.orig

          # Rewrite name and strip workspace:* deps in one jq pass.
          # publishConfig.access stays — unscoped packages need it for first publish.
          jq '
            .name = "open-design-dev-fork" |
            .dependencies |= with_entries(select(.value != "workspace:*"))
          ' package.json > package.json.tmp
          mv package.json.tmp package.json

          echo "::group::Modified package.json"
          cat package.json
          echo "::endgroup::"

          npm pack

          mv package.json.orig package.json

      - name: Publish to npm
        working-directory: apps/daemon
        run: npm publish open-design-dev-fork-*.tgz --provenance --access public
